<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Usuario – SpringEduManager</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<nav class="navbar">
  <a th:href="@{/dashboard}" class="brand">SpringEduManager</a>
  <div class="nav-links">
    <a th:href="@{/usuarios}">← Volver a Usuarios</a>
    <form th:action="@{/logout}" method="post" style="display:inline;margin:0;padding:0">
      <button type="submit"
              style="background:none;border:none;cursor:pointer;color:rgba(255,255,255,.85);font-size:14px;padding:0;margin-left:16px;font-family:inherit">
        Cerrar sesión
      </button>
    </form>
  </div>
</nav>

<main class="container">
  <h1 th:text="${usuario.id == null} ? 'Nuevo Usuario' : 'Editar Usuario'"></h1>

  <form th:action="${usuario.id == null} ? @{/usuarios/nuevo} : @{/usuarios/editar/{id}(id=${usuario.id})}"
        method="post"
        class="form-card">

    <!-- ── Datos del usuario ─────────────────────────────── -->
    <h2 class="form-section-title">Datos del usuario</h2>

    <div class="form-row">
      <div class="form-group">
        <label for="username">Username *</label>
        <input type="text" id="username" name="username"
               th:value="${usuario.username}"
               placeholder="Ej: sofia.martinez" required>
      </div>
      <div class="form-group">
        <label for="rol">Rol *</label>
        <select id="rol" name="rol">
          <option value="ROLE_USER"
                  th:selected="${usuario.rol == 'ROLE_USER'}">User (Estudiante)</option>
          <option value="ROLE_ADMIN"
                  th:selected="${usuario.rol == 'ROLE_ADMIN'}">Admin</option>
        </select>
      </div>
    </div>

    <!-- Password solo visible al crear -->
    <div class="form-group" th:if="${usuario.id == null}">
      <label for="password">Contraseña *</label>
      <input type="password" id="password" name="password"
             placeholder="Mínimo 6 caracteres" required>
    </div>

    <div class="form-group form-check" th:unless="${usuario.id == null}">
      <input type="checkbox" id="activo" name="activo"
             th:checked="${usuario.activo}">
      <label for="activo">Usuario activo</label>
    </div>

    <!-- ── Vínculo con estudiante ────────────────────────── -->
    <h2 class="form-section-title">Estudiante vinculado
      <span style="font-size:12px;font-weight:400;color:#888">(opcional)</span>
    </h2>

    <div class="form-group">
      <label for="estudianteId">Seleccionar estudiante</label>
      <select id="estudianteId" name="estudianteId">
        <option value="">Sin vincular</option>
        <option th:each="e : ${estudiantes}"
                th:value="${e.id}"
                th:text="${e.nombre + ' ' + e.apellido + ' — ' + e.rut + ' (' + e.nivelMineduc + ' ' + e.seccion + ')'}"
                th:selected="${usuario.estudiante != null and usuario.estudiante.id == e.id}">
        </option>
      </select>
      <small style="color:#888;font-size:12px;margin-top:4px;display:block">
        Al vincular, este usuario verá los cursos, prácticas y evaluaciones del estudiante seleccionado.
      </small>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a th:href="@{/usuarios}" class="btn">Cancelar</a>
    </div>

  </form>
</main>

</body>
</html>
