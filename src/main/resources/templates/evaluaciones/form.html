<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Evaluación – SpringEduManager</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<nav class="navbar">
  <a th:href="@{/dashboard}" class="brand">SpringEduManager</a>
  <div class="nav-links">
    <a th:href="@{/evaluaciones}">← Volver a Evaluaciones</a>
    <form th:action="@{/logout}" method="post" style="display:inline;margin:0;padding:0">
      <button type="submit"
              style="background:none;border:none;cursor:pointer;color:rgba(255,255,255,.85);font-size:14px;padding:0;margin-left:16px;font-family:inherit">
        Cerrar sesión
      </button>
    </form>
  </div>
</nav>

<main class="container">
  <h1 th:text="${evaluacion.id == null} ? 'Nueva Evaluación' : 'Editar Evaluación'"></h1>

  <form th:action="${evaluacion.id == null} ? @{/evaluaciones/nuevo} : @{/evaluaciones/editar/{id}(id=${evaluacion.id})}"
        th:object="${evaluacion}"
        method="post"
        class="form-card">

    <h2 class="form-section-title">Datos de la evaluación</h2>

    <div class="form-group">
      <label for="nombre">Nombre *</label>
      <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej: Prueba Unidad 1">
      <span class="error-msg" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" th:field="*{descripcion}" rows="3"
                placeholder="Descripción de la evaluación..."></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="tipo">Tipo *</label>
        <select id="tipo" th:field="*{tipo}">
          <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
        </select>
      </div>
      <div class="form-group">
        <label for="fecha">Fecha *</label>
        <input type="date" id="fecha" th:field="*{fecha}">
        <span class="error-msg" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></span>
      </div>
    </div>

    <div class="form-group">
      <label for="nota">Nota (1.0 – 7.0) *</label>
      <input type="number" id="nota" th:field="*{nota}"
             min="1.0" max="7.0" lang="en" step="0.1" placeholder="Ej: 5.5">
      <span class="error-msg" th:if="${#fields.hasErrors('nota')}" th:errors="*{nota}"></span>
    </div>

    <h2 class="form-section-title">Asignación</h2>

    <div class="form-row">
      <div class="form-group">
        <label for="curso">Curso *</label>
        <select id="curso" th:field="*{curso}">
          <option value="">Seleccionar curso...</option>
          <option th:each="c : ${cursos}"
                  th:value="${c.id}"
                  th:text="${c.nombre}"></option>
        </select>
      </div>
      <div class="form-group">
        <label for="estudiante">Estudiante *</label>
        <select id="estudiante" th:field="*{estudiante}">
          <option value="">Seleccionar estudiante...</option>
          <option th:each="e : ${estudiantes}"
                  th:value="${e.id}"
                  th:text="${e.nombre + ' ' + e.apellido + ' (' + e.rut + ')'}"></option>
        </select>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a th:href="@{/evaluaciones}" class="btn">Cancelar</a>
    </div>

  </form>
</main>

</body>
</html>
