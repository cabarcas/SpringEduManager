<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Login – SpringEduManager</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <h1>SpringEduManager</h1>
    <h2>Iniciar sesión</h2>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${msg}" th:text="${msg}"></div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username"
               placeholder="admin o user" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>

    <p class="login-hint">
      ¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a>
    </p>

    <p class="login-hint">
      Usuarios de prueba:<br>
      <code>admin / admin123</code> (ADMIN)<br>
      <code>user / user123</code> (USER)
    </p>
  </div>
</div>

</body>
</html>
