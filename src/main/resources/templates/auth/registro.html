<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registro – SpringEduManager</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card" style="max-width:440px">
    <h1>SpringEduManager</h1>
    <h2>Crear cuenta</h2>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/registro}" method="post">

      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre *</label>
          <input type="text" id="nombre" name="nombre" required placeholder="Ej: Sofía">
        </div>
        <div class="form-group">
          <label for="apellido">Apellido *</label>
          <input type="text" id="apellido" name="apellido" required placeholder="Ej: Martínez">
        </div>
      </div>

      <div class="form-group">
        <label for="rut">RUT *</label>
        <input type="text" id="rut" name="rut" required placeholder="Ej: 21.345.678-3">
      </div>

      <div class="form-group">
        <label for="username">Nombre de usuario *</label>
        <input type="text" id="username" name="username" required placeholder="Ej: sofia.martinez">
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit" class="btn btn-primary">Registrarse</button>
    </form>

    <p class="login-hint" style="margin-top:16px">
      ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
    </p>
  </div>
</div>

</body>
</html>
