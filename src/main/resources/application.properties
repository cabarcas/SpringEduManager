spring.application.name=springedumanager

# ================================================================
# DIFERENCIA CLAVE: Este archivo reemplaza web.xml + server.xml
#
# Antes necesitabas:
#   /WEB-INF/web.xml          → mapear cada Servlet
#   /META-INF/context.xml     → configurar el DataSource
#   Tomcat/conf/server.xml    → configurar el puerto
#
# Ahora todo va aquí en texto plano.
# ================================================================

server.port=8082

# ── Base de datos ─────────────────────────────────────────────
# DIFERENCIA: Usamos H2 embebido para desarrollo.
# No necesitas instalar MySQL para que el proyecto arranque.
# H2 vive en memoria: se crea al iniciar, se borra al cerrar.
#
# Antes (context.xml de Tomcat):
#   <Resource name="jdbc/edu" type="javax.sql.DataSource"
#             url="jdbc:mysql://localhost:3306/edudb"
#             username="root" password="1234"/>
#
# Ahora:
#spring.datasource.url=jdbc:h2:mem:edudb;DB_CLOSE_DELAY=-1
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

# Ver las tablas en el navegador mientras desarrollas:
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# ── JPA / Hibernate ───────────────────────────────────────────
# DIFERENCIA: Hibernate lee tus @Entity y crea las tablas solo.
# Antes tenías que escribir el script CREATE TABLE manualmente.
#spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true

# ── Thymeleaf ─────────────────────────────────────────────────
# DIFERENCIA: Reemplaza el motor JSP.
# Los archivos .html van en src/main/resources/templates/
# Antes los .jsp iban en /WEB-INF/views/
spring.thymeleaf.cache=false

# ── Para cambiar a MySQL cuando entregues el proyecto: ─────────
# Comenta el bloque H2 de arriba y descomenta esto:
spring.datasource.url=jdbc:mysql://localhost:3306/edumanager_db
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
